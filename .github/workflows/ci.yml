name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ruff
        run: |
          python -m ruff check .

      - name: Run mypy
        run: |
          python -m mypy . || true

      - name: Run bandit
        run: |
          python -m bandit -r . -c bandit.yml || true

      - name: Run tests
        run: |
          python -m pytest -q
